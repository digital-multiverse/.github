name: 🐛 Bug report
description: Report something that isn't working as expected
labels: ["type: bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment (browser, OS, device)
      placeholder: e.g. Chrome 126 on Windows 11
    validations:
      required: false
